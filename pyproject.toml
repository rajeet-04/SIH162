[project]
name = "thermis-sih26162"
version = "0.1.0"
description = "SIH26162 industrial thermal-source detection MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "catboost>=1.2,<2",
  "fastapi>=0.115,<1",
  "h5py>=3.11,<4",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "netcdf4>=1.7,<2",
  "pandas>=2.2,<3",
  "pandera>=0.20,<1",
  "pyarrow>=17,<22",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1,<2",
  "pyshp>=2.3,<3",
  "pyyaml>=6.0,<7",
  "rasterio>=1.4,<2",
  "rich>=13.9,<14",
  "scikit-learn>=1.5,<2",
  "safetensors>=0.4,<1",
  "typer>=0.15,<1",
  "torch==2.13.0+cu130; sys_platform == 'win32'",
  "torch>=2.8,<3; sys_platform != 'win32'",
  "torchvision==0.28.0+cu130; sys_platform == 'win32'",
  "torchvision>=0.23,<1; sys_platform != 'win32'",
  "uvicorn>=0.32,<1",
  "xarray>=2024.10,<2027",
]

[project.scripts]
thermis = "thermis.cli:app"

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thermis"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
